spring.application.name=hotel-reservation-backend
server.port=${PORT:8080}
# Comma-separated list of allowed origins for CORS (use * to allow any origin)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.jackson.serialization.write-dates-as-timestamps=false

# Database: PostgreSQL in production (Railway); in-memory H2 when no datasource is configured
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hotel;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
